name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PHP_VERSION: '8.1'

jobs:
  build-and-unit:
    name: Build & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:only

      - name: Unit test
        run: npm run test:unit

  api-integration:
    name: API integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      # Tes API hanya memakai modul bawaan Node (node:test, node:child_process),
      # jadi tidak perlu `npm ci`. Database dibuat di folder sementara.
      - name: API integration test
        run: npm run test:api
